<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0b030" />
      <stop offset="100%" stop-color="#f0c040" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="transparent" />

  <g fill="#2a2a3a">
    <circle cx="150" cy="150" r="3" />
    <circle cx="650" cy="120" r="4" />
    <circle cx="700" cy="450" r="3" />
    <circle cx="120" cy="480" r="4" />
    <circle cx="200" cy="300" r="2" />
    <circle cx="600" cy="350" r="2" />
  </g>

  <circle cx="400" cy="260" r="180" stroke="#2a2a3a" stroke-width="1.5" fill="none" stroke-dasharray="10 15" />
  <circle cx="400" cy="260" r="240" stroke="#16161f" stroke-width="1" fill="none" stroke-dasharray="5 10" />

  <g transform="translate(0, -20)">
    <circle cx="400" cy="280" r="90" stroke="url(#goldGrad)" stroke-width="6" fill="none" filter="url(#glow-light)" />
    
    <path d="M400 200 L345 330 L370 330 L385 290 L415 290 L430 330 L455 330 Z M393 270 L400 245 L407 270 Z" fill="#ffffff" />
    
    <path d="M 310 320 L 370 260 L 410 300 L 490 190 L 520 220 L 520 170 L 470 170 L 490 190 L 410 300 L 370 260 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <g transform="translate(200, 100)">
    <circle cx="30" cy="30" r="35" fill="#16161f" stroke="#2a2a3a" stroke-width="2" />
    <text x="30" y="38" fill="#a0a0b0" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(540, 100)">
    <circle cx="30" cy="30" r="35" fill="#16161f" stroke="#2a2a3a" stroke-width="2" />
    <rect x="16" y="32" width="6" height="12" fill="#a0a0b0" rx="1"/>
    <rect x="27" y="24" width="6" height="20" fill="#a0a0b0" rx="1"/>
    <rect x="38" y="16" width="6" height="28" fill="#f0c040" rx="1" filter="url(#glow-light)"/>
  </g>

  <g transform="translate(180, 310)">
    <circle cx="30" cy="30" r="35" fill="#16161f" stroke="#2a2a3a" stroke-width="2" />
    <path d="M16 20 C16 15, 44 15, 44 20 C44 25, 16 25, 16 20 Z M16 28 C16 33, 44 33, 44 28 M16 36 C16 41, 44 41, 44 36" stroke="#a0a0b0" stroke-width="3" fill="none" />
    <line x1="16" y1="20" x2="16" y2="36" stroke="#a0a0b0" stroke-width="3" />
    <line x1="44" y1="20" x2="44" y2="36" stroke="#a0a0b0" stroke-width="3" />
  </g>

  <g transform="translate(560, 310)">
    <circle cx="30" cy="30" r="35" fill="#16161f" stroke="#2a2a3a" stroke-width="2" />
    <path d="M22 38 A 5 5 0 1 1 22 30 L 22 16 L 40 20 L 40 34 A 5 5 0 1 1 40 26 L 40 22 L 25 19 L 25 38" fill="none" stroke="#a0a0b0" stroke-width="3" />
  </g>

  <g transform="translate(370, 15)">
    <circle cx="30" cy="30" r="35" fill="#16161f" stroke="#2a2a3a" stroke-width="2" />
    <path d="M15 35 L30 42 L45 35 L30 28 Z M15 28 L30 35 L45 28 L30 21 Z M15 21 L30 28 L45 21 L30 14 Z" fill="none" stroke="#f0c040" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <text x="400" y="480" fill="#ffffff" font-family="'Inter', sans-serif" font-size="38" font-weight="700" text-anchor="middle" letter-spacing="-1">
    S Adithya
  </text>
  
  <text x="400" y="515" fill="#a0a0b0" font-family="'Inter', sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="3">
    FINANCE <tspan fill="#f0c040">|</tspan> ANALYTICS <tspan fill="#f0c040">|</tspan> MBA
  </text>

  <line x1="300" y1="550" x2="500" y2="550" stroke="#2a2a3a" stroke-width="2" />
  <rect x="390" y="548" width="20" height="4" fill="#f0c040" rx="2" filter="url(#glow-light)" />

</svg>